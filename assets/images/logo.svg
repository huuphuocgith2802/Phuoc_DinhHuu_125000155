<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="44" fill="#0f172a" stroke="url(#logoGrad)" stroke-width="4" filter="url(#glow)"/>
  <!-- Soundwave / Headphones symbol -->
  <path d="M26 52 A24 24 0 0 1 74 52" fill="none" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round"/>
  <rect x="22" y="48" width="10" height="20" rx="5" fill="#06b6d4"/>
  <rect x="68" y="48" width="10" height="20" rx="5" fill="#8b5cf6"/>
  <!-- Dynamic equalizer bars -->
  <line x1="42" y1="42" x2="42" y2="58" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="36" x2="50" y2="64" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="58" y1="44" x2="58" y2="56" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round"/>
</svg>